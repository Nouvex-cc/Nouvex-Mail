services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: nouvex
      POSTGRES_PASSWORD: nouvex
      POSTGRES_DB: nouvex
    ports: ["${PG_PORT:-5432}:5432"]
    volumes: [pg:/var/lib/postgresql]
    healthcheck:
      test: pg_isready -U nouvex
      interval: 2s

  nats:
    image: nats:2.15
    command: -js -sd /data -m 8222
    ports: ["4222:4222", "8222:8222"]
    volumes: [nats:/data]

  s3:
    image: chrislusf/seaweedfs
    command: server -s3 -s3.config=/etc/s3.json -dir=/data
    ports: ["8333:8333"]
    volumes: [s3:/data, ./docker/s3.json:/etc/s3.json:ro]

  # Local IMAP and SMTP server: any address works, mailboxes are created on first login, any password is accepted.
  greenmail:
    image: greenmail/standalone:latest
    environment:
      GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    ports: ["993:3993", "465:3465"]

  lgtm:
    image: grafana/otel-lgtm
    profiles: [obs]
    ports: ["3001:3000", "4317:4317", "4318:4318"]

volumes:
  pg:
  nats:
  s3:
