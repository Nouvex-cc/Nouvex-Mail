services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: nouvex
      POSTGRES_PASSWORD: nouvex
      POSTGRES_DB: nouvex
    ports: ["${PG_PORT:-5432}:5432"]
    volumes: [pg:/var/lib/postgresql]
    healthcheck:
      test: pg_isready -U nouvex
      interval: 2s

  nats:
    image: nats:2.15
    command: -js -sd /data -m 8222
    ports: ["4222:4222", "8222:8222"]
    volumes: [nats:/data]

  s3:
    image: chrislusf/seaweedfs
    command: server -s3 -s3.config=/etc/s3.json -dir=/data
    ports: ["8333:8333"]
    volumes: [s3:/data, ./docker/s3.json:/etc/s3.json:ro]

  # Local IMAP and SMTP server: any address works, mailboxes are created on first login, any password is accepted.
  greenmail:
    image: greenmail/standalone:latest
    environment:
      GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    ports: ["993:3993", "465:3465"]

  # IMAP server with CONDSTORE for engine tests and benchmarks: any user, password hunter2.
  dovecot:
    image: dovecot/dovecot:latest
    profiles: [bench]
    environment:
      USER_PASSWORD: "{PLAIN}hunter2"
    ports: ["31143:31143"]

  # Embeddings for sorting, set EMBED_URL=http://localhost:8090 for the engine. On Apple silicon use
  # EMBED_IMAGE=ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-1.9.4.
  embed:
    image: ${EMBED_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4}
    profiles: [embed]
    command: >-
      --model-id intfloat/multilingual-e5-small --tokenization-workers 2 --max-batch-tokens 4096
      --max-client-batch-size 50 --max-concurrent-requests 64
    ports: ["8090:80"]
    volumes: [models:/data]

  lgtm:
    image: grafana/otel-lgtm
    profiles: [obs]
    ports: ["3001:3000", "4317:4317", "4318:4318"]

volumes:
  pg:
  nats:
  s3:
  models:
