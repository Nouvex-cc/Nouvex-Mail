name: Nouvex
options:
  bundleIdPrefix: cc.nouvex
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.11.1
  OpenAPIGenerator:
    url: https://github.com/apple/swift-openapi-generator
    from: 1.14.0
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.13.0
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.3.2
targets:
  Nouvex:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Nouvex]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: Nouvex Mail
        PRODUCT_MODULE_NAME: Nouvex
        PRODUCT_BUNDLE_IDENTIFIER: cc.nouvex.Nouvex
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: SQR8LP4972
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        # Only what the generated Info.plist can't say: plain http stays allowed on the local network.
        INFOPLIST_FILE: Nouvex/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Nouvex Mail
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Nouvex Mail connects to a mail server on your network when you sign in to one.
      # A development build keeps its own data and sign-in, apart from the installed app.
      configs:
        Debug:
          PRODUCT_NAME: Nouvex Mail Dev
          PRODUCT_BUNDLE_IDENTIFIER: cc.nouvex.Nouvex.dev
          INFOPLIST_KEY_CFBundleDisplayName: Nouvex Mail Dev
        # Passkeys need the app tied to mail.nouvex.cc, and that needs a real signature on the Mac too.
        Release:
          CODE_SIGN_ENTITLEMENTS: Nouvex/Nouvex.entitlements
          "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
    dependencies:
      - package: GRDB
      - package: OpenAPIRuntime
      - package: OpenAPIURLSession
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: OpenAPIGenerator
    scheme:
      testTargets: [NouvexTests]
  # Checks against what the engine sealed, without starting the app.
  NouvexTests:
    type: bundle.unit-test
    platform: macOS
    sources: [NouvexTests, Nouvex/Crypto.swift, Nouvex/Focus.swift]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: SQR8LP4972
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        GENERATE_INFOPLIST_FILE: YES
