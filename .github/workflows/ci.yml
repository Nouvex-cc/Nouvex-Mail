name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: nouvex, POSTGRES_PASSWORD: nouvex, POSTGRES_DB: nouvex }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U nouvex" --health-interval 2s
    env:
      DATABASE_URL: postgres://nouvex:nouvex@localhost:5432/nouvex
      NATS_URL: nats://localhost:4222
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci
      S3_ENDPOINT: http://localhost:8333
      S3_BUCKET: nouvex
      S3_ACCESS_KEY_ID: nouvex
      S3_SECRET_ACCESS_KEY: nouvex
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: touch .env && bun run db:migrate
      # Not a service: services can't take arguments, and sends need JetStream, as on the server.
      - run: docker run -d --name nats -p 4222:4222 nats:2.15 -js
      # Not a service: it needs docker/s3.json from the checkout.
      - name: S3
        run: |
          docker run -d --name s3 -p 8333:8333 -v "$PWD/docker/s3.json:/etc/s3.json:ro" chrislusf/seaweedfs server -s3 -s3.config=/etc/s3.json -dir=/data
          until echo "s3.bucket.create -name nouvex" | docker exec -i s3 weed shell 2>/dev/null | grep -q "created bucket"; do sleep 2; done
          until bun -e 'await Bun.s3.write("ping", "1")' 2>/dev/null; do sleep 1; done
      - run: bunx oxlint
      - run: bunx turbo lint typecheck test build --filter='!@nouvex/engine'
      - name: OpenAPI document is current
        run: bun run openapi && git diff --exit-code apps/apple/Nouvex/openapi.json
      - name: Rich mail runtime is current
        run: bun run --cwd packages/rich runtime && git diff --exit-code packages/rich/runtime.js apps/apple/Nouvex/RichRuntime.js

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: nouvex, POSTGRES_PASSWORD: nouvex, POSTGRES_DB: nouvex }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U nouvex" --health-interval 2s
      # A real IMAP server with CONDSTORE, the way most providers sync; see engine/internal/mail/bench_test.go.
      dovecot:
        image: dovecot/dovecot:latest
        env: { USER_PASSWORD: "{PLAIN}hunter2" }
        ports: ["31143:31143"]
    env:
      DATABASE_URL: postgres://nouvex:nouvex@localhost:5432/nouvex
      IMAP_SERVER: 127.0.0.1:31143
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && touch ../.env && bun run db:migrate
        working-directory: .
      - uses: actions/setup-go@v7
        with: { go-version-file: engine/go.mod, cache-dependency-path: engine/go.sum }
      - uses: golangci/golangci-lint-action@v9
        with: { working-directory: engine }
      - run: go test -race ./...
      - uses: sqlc-dev/setup-sqlc@v5
        with: { sqlc-version: "1.31.1" }
      - run: sqlc diff

  # The images the server builds from main, built here first so a broken one never reaches it.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp deploy/.env.example deploy/.env && docker compose -f deploy/compose.yml build

  # Builds against the oldest iOS the app supports (deploymentTarget in apps/apple/project.yml), so a newer API
  # without #available fails here.
  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - working-directory: apps/apple
        run: |
          xcodegen
          xcodebuild -project Nouvex.xcodeproj -scheme Nouvex -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO build
